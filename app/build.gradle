plugins {
    id 'com.android.application'
}

android {
    namespace 'com.milauncher.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.milauncher.tv'
        minSdk 21
        targetSdk 28
        versionCode 7
        versionName '7.0'
    }

    // Firma fija: así cada versión nueva se instala encima de la anterior sin desinstalar.
    signingConfigs {
        fixed {
            storeFile file('milauncher.keystore')
            storePassword 'milauncher123'
            keyAlias 'milauncher'
            keyPassword 'milauncher123'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        // Este build ("debug" solo por el nombre del comando) sale optimizado:
        // código reducido con R8, sin modo depuración y con la firma fija.
        debug {
            signingConfig signingConfigs.fixed
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // El chequeo de lint que corre en builds "no debug" se queja del targetSdk bajo
    // (pensado para Play Store). Acá no publicamos, así que lo desactivamos.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
