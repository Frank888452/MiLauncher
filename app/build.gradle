plugins {
    id 'com.android.application'
}

android {
    namespace 'com.milauncher.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.milauncher.tv'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    // Firma fija: así cada versión nueva se instala encima de la anterior sin desinstalar.
    signingConfigs {
        fixed {
            storeFile file('milauncher.keystore')
            storePassword 'milauncher123'
            keyAlias 'milauncher'
            keyPassword 'milauncher123'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
